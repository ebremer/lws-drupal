lws_authz.settings:
  type: config_object
  label: 'LWS authorization settings'
  mapping:
    authorization_server:
      type: string
      label: 'The authorization server of storages that name none: "local" for this site''s own, or the ID of a trusted server.'
    clock_skew:
      type: integer
      label: 'The clock skew allowed when checking the times in access tokens and credentials, in seconds.'
    token_lifetime:
      type: integer
      label: 'The lifetime of the access tokens this site issues, in seconds.'
    suites:
      type: sequence
      label: 'The authentication suites whose credentials this site exchanges for access tokens.'
      sequence:
        type: string
        label: 'Authentication suite plugin ID'
    rate_limits:
      type: mapping
      label: 'Token endpoint rate limits'
      mapping:
        client:
          type: integer
          label: 'Token requests per minute from one client address.'
        subject:
          type: integer
          label: 'Tokens issued per minute to one subject.'
        access_requests:
          type: integer
          label: 'Access requests one agent may submit per hour.'
    openid:
      type: mapping
      label: 'OpenID Connect authentication suite'
      mapping:
        discovery:
          type: boolean
          label: 'Whether an ID Token from a provider that is not configured is accepted when its subject''s controlled identifier document names the provider (lws10-authn-openid §5).'
        require_as_audience:
          type: boolean
          label: 'Whether such an ID Token must name this authorization server in "aud".'

lws_authz.trusted_as.*:
  type: config_entity
  label: 'Trusted authorization server'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    issuer:
      type: uri
      label: 'Issuer identifier: the "iss" of its tokens and the "as_uri" of challenges.'
    jwks:
      type: string
      label: 'Pinned JSON Web Key Set. Empty to fetch the keys from the jwks_uri of its metadata.'

lws_authz.trusted_issuer.*:
  type: config_entity
  label: 'Trusted OpenID Provider'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    issuer:
      type: uri
      label: 'Issuer identifier: the "iss" of its ID Tokens.'
    jwks:
      type: string
      label: 'Pinned JSON Web Key Set. Empty to discover the keys.'
    require_as_audience:
      type: boolean
      label: 'Whether its ID Tokens must name this authorization server in "aud".'
    verify_subject:
      type: boolean
      label: 'Whether each subject''s controlled identifier document must name it as an OpenID Provider.'
