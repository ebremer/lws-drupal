services:
  logger.channel.lws_authz:
    parent: logger.channel_base
    arguments: ['lws_authz']

  lws_authz.authorization_servers:
    class: Drupal\lws_authz\AuthorizationServers
    arguments: ['@entity_type.manager', '@config.factory', '@lws_authz.local_server']
  Drupal\lws_authz\AuthorizationServers: '@lws_authz.authorization_servers'

  # This site's own authorization server (DESIGN.md §6.2, §6.3).
  lws_authz.local_server:
    class: Drupal\lws_authz\Server\LocalAuthorizationServer
    arguments: ['@lws.url_generator', '@lws.url_parser', '@lws_authz.signing_keys', '@plugin.manager.lws_authentication_suite']
  Drupal\lws_authz\Server\LocalAuthorizationServer: '@lws_authz.local_server'

  lws_authz.signing_keys:
    class: Drupal\lws_authz\Server\SigningKeys
    arguments: ['@settings', '@lock', '@datetime.time', '@config.factory', '@logger.channel.lws_authz']
  Drupal\lws_authz\Server\SigningKeys: '@lws_authz.signing_keys'

  lws_authz.token_exchange:
    class: Drupal\lws_authz\Server\TokenExchange
    arguments:
      - '@lws_authz.local_server'
      - '@lws_authz.authorization_servers'
      - '@plugin.manager.lws_authentication_suite'
      - '@lws_authz.signing_keys'
      - '@lws.url_generator'
      - '@lws.url_parser'
      - '@flood'
      - '@uuid'
      - '@datetime.time'
      - '@config.factory'
      - '@logger.channel.lws_authz'
      # Provided by lws_storage; without it there are no storages to issue for.
      - '@?Drupal\lws\Storage\StorageRegistryInterface'
  Drupal\lws_authz\Server\TokenExchange: '@lws_authz.token_exchange'

  plugin.manager.lws_authentication_suite:
    class: Drupal\lws_authz\AuthenticationSuite\AuthenticationSuiteManager
    parent: default_plugin_manager
    arguments: ['@config.factory']
  Drupal\lws_authz\AuthenticationSuite\AuthenticationSuiteManager: '@plugin.manager.lws_authentication_suite'

  lws_authz.cid_resolver:
    class: Drupal\lws_authz\Cid\DocumentResolver
    arguments: ['@lws.outbound_http', '@cache.lws', '@datetime.time', '@logger.channel.lws_authz']
  Drupal\lws_authz\Cid\DocumentResolver: '@lws_authz.cid_resolver'

  lws_authz.keys:
    class: Drupal\lws_authz\Token\AuthorizationServerKeys
    arguments: ['@lws.outbound_http', '@cache.lws', '@flood', '@datetime.time', '@logger.channel.lws_authz']
  Drupal\lws_authz\Token\AuthorizationServerKeys: '@lws_authz.keys'

  lws_authz.access_token_validator:
    class: Drupal\lws_authz\Token\AccessTokenValidator
    arguments: ['@lws_authz.keys', '@datetime.time', '@config.factory', '@logger.channel.lws_authz']
  Drupal\lws_authz\Token\AccessTokenValidator: '@lws_authz.access_token_validator'

  lws_authz.authentication.lws_bearer:
    class: Drupal\lws_authz\Authentication\LwsBearerProvider
    arguments:
      - '@lws.url_parser'
      # Provided by lws_storage; without it there are no storages to protect.
      - '@?Drupal\lws\Storage\StorageRegistryInterface'
      - '@lws_authz.authorization_servers'
      - '@lws_authz.access_token_validator'
      - '@logger.channel.lws_authz'
    tags:
      # Above basic_auth (100) and cookie (0). It applies only in the LWS URL
      # space, so it takes nothing from other providers elsewhere.
      - { name: authentication_provider, provider_id: lws_bearer, priority: 200 }

  # The policy decision point (DESIGN.md §6.5).
  lws_authz.access_decision:
    class: Drupal\lws_authz\Access\PolicyAccessDecision
    arguments: ['@lws_authz.policy_store', '@datetime.time']
  Drupal\lws\Access\AccessDecisionInterface: '@lws_authz.access_decision'

  lws_authz.policy_store:
    class: Drupal\lws_authz\Policy\PolicyStore
    arguments: ['@entity_type.manager']
  Drupal\lws_authz\Policy\PolicyStore: '@lws_authz.policy_store'

  lws_authz.policy_parser:
    class: Drupal\lws_authz\Policy\AccessPolicyParser
    arguments: ['@lws.url_parser', '@lws.url_generator']
  Drupal\lws_authz\Policy\AccessPolicyParser: '@lws_authz.policy_parser'
