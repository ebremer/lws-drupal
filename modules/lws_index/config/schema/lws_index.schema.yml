lws_index.settings:
  type: config_object
  label: 'LWS type index settings'
  mapping:
    relations:
      type: sequence
      label: 'The descriptive link relations searches may filter on, besides type: registered relation types in lower case, extension relations as URIs'
      sequence:
        type: string
        label: 'Relation'
    content_types:
      type: mapping
      label: 'Types read from content'
      mapping:
        enabled:
          type: boolean
          label: 'Read the types Turtle and N-Triples content states about the resource itself'
        max_bytes:
          type: integer
          label: 'The largest content read, in bytes'
          constraints:
            Range:
              min: 0
