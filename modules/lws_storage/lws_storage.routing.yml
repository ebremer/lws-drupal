# Internal routes of the LWS URL space; see lws.routing.yml. LwsRouteEnhancer
# supplies $lws_target and the storage slug, which the lws_storage parameter
# converter turns into the storage entity (404 if there is none, 503 if it is
# blocked). Access is the "_lws_access" check (LwsAccessCheck), after the
# lws_bearer provider of lws_authz has validated any access token. Methods the
# shape of the URL does not allow, such as PUT on a container, were already
# refused with 405 by LwsRequestSubscriber.

lws_storage.description:
  path: '/_lws/description'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\StorageController::description'
  methods: [GET, HEAD]
  requirements:
    # The storage description is public: clients read it to find the storage
    # root and the services before they have a token (LWS Core §6.1).
    _lws_access: 'public'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.resource:
  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceController::read'
  methods: [GET, HEAD]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.resource.create:
  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceController::post'
  methods: [POST]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.resource.replace:
  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceController::put'
  methods: [PUT]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.resource.patch:
  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceController::patch'
  methods: [PATCH]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.resource.delete:
  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceController::delete'
  methods: [DELETE]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

# The linkset of a resource.
lws_storage.linkset:
  path: '/_lws/meta'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\LinksetController::read'
  methods: [GET, HEAD]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.linkset.put:
  path: '/_lws/meta'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\LinksetController::put'
  methods: [PUT]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

lws_storage.linkset.patch:
  path: '/_lws/meta'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\LinksetController::patch'
  methods: [PATCH]
  requirements:
    _lws_access: 'resource'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE
    parameters:
      lws_storage:
        type: lws_storage

# The access page of a storage (DESIGN.md §6.5), by entity ID. Its storage
# administrators and its owner manage who may do what in it.
lws_storage.access:
  path: '/admin/content/lws/{lws_storage}/access'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\StorageAccessController::page'
    _title_callback: '\Drupal\lws_storage\Controller\StorageAccessController::title'
  requirements:
    _custom_access: '\Drupal\lws_storage\Controller\StorageAccessController::access'
    lws_storage: '\d+'
  options:
    _admin_route: TRUE
    parameters:
      lws_storage:
        type: entity:lws_storage

lws_storage.access_delete:
  path: '/admin/content/lws/{lws_storage}/access/{lws_policy}/delete'
  defaults:
    _form: '\Drupal\lws_storage\Form\PolicyDeleteForm'
    _title: 'Remove access'
  requirements:
    _custom_access: '\Drupal\lws_storage\Controller\StorageAccessController::access'
    lws_storage: '\d+'
    lws_policy: '\d+'
  options:
    _admin_route: TRUE
    parameters:
      lws_storage:
        type: entity:lws_storage
      lws_policy:
        type: entity:lws_policy

lws_storage.access_request:
  path: '/admin/content/lws/{lws_storage}/access/requests/{lws_access}/{decision}'
  defaults:
    _form: '\Drupal\lws_storage\Form\AccessRequestForm'
    _title: 'Access request'
  requirements:
    _custom_access: '\Drupal\lws_storage\Controller\StorageAccessController::access'
    lws_storage: '\d+'
    lws_access: '\d+'
    decision: 'approve|deny'
  options:
    _admin_route: TRUE
    parameters:
      lws_storage:
        type: entity:lws_storage
      lws_access:
        type: entity:lws_access

lws_storage.settings:
  path: '/admin/config/services/lws/storage'
  defaults:
    _form: '\Drupal\lws_storage\Form\StorageSettingsForm'
    _title: 'Linked Web Storage'
  requirements:
    _permission: 'administer lws'

# Makes a Media item from a copy of a data resource's content; see the
# resource browser, a View in config/optional.
lws_storage.resource_media:
  path: '/admin/content/lws/{lws_storage}/resources/{lws_resource}/media'
  defaults:
    _form: '\Drupal\lws_storage\Form\ResourceMediaForm'
    _title: 'Create media item'
  requirements:
    _custom_access: '\Drupal\lws_storage\Form\ResourceMediaForm::access'
    lws_storage: '\d+'
    lws_resource: '\d+'
  options:
    _admin_route: TRUE
    parameters:
      lws_storage:
        type: entity:lws_storage
      lws_resource:
        type: entity:lws_resource

# The resource browser: storage administrators only.
lws_storage.resources:
  path: '/admin/content/lws/{lws_storage}/resources'
  defaults:
    _controller: '\Drupal\lws_storage\Controller\ResourceBrowserController::page'
    _title_callback: '\Drupal\lws_storage\Controller\ResourceBrowserController::title'
  requirements:
    _permission: 'administer lws storages'
    lws_storage: '\d+'
  options:
    _admin_route: TRUE
    parameters:
      lws_storage:
        type: entity:lws_storage
