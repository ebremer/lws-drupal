lws.settings:
  type: config_object
  label: 'Linked Web Storage settings'
  mapping:
    base_url:
      type: string
      label: 'Canonical base URL: scheme, host and any base path, with no trailing slash. Empty derives it from the request, which is only safe in development.'
    prefix:
      type: string
      label: 'Path prefix of the LWS URL space, starting with a slash and with no trailing slash.'
    conceal_existence:
      type: boolean
      label: 'Whether an agent refused access answers 404, not 403, so that it cannot tell whether a resource exists.'
