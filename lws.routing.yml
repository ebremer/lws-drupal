# The LWS URL space (DESIGN.md §4.2). LwsPathProcessor maps every URL under the
# configured prefix onto an internal path, and LwsRouteEnhancer parses the
# original URL into the controller's $lws_target argument. Requested directly,
# the internal paths answer 404. OPTIONS requests and malformed paths never
# reach a route: LwsRequestSubscriber answers them before core does.
#
# This module routes only the paths at which nothing can exist. lws_storage
# routes the storage description and resources.

lws.unknown:
  path: '/_lws/unknown'
  defaults:
    _controller: '\Drupal\lws\Controller\UnknownController::unknown'
  requirements:
    # Nothing exists here, for anyone.
    _access: 'TRUE'
  options:
    _lws: TRUE
    _auth: ['lws_bearer']
    no_cache: TRUE

lws.settings:
  path: '/admin/config/services/lws'
  defaults:
    _form: '\Drupal\lws\Form\SettingsForm'
    _title: 'Linked Web Storage'
  requirements:
    _permission: 'administer lws'
