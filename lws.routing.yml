  path: '/_lws/resource'
  defaults:
    _controller: '\Drupal\lws\Controller\UrlSpaceController::resource'
  methods: [GET, HEAD]
  requirements:
    # Every request may reach the URL space; the LWS access policy decides
    # per resource (DESIGN.md §5.4), not the route.
    _access: 'TRUE'
  options:
    _lws: TRUE
