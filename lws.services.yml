services:
  logger.channel.lws:
    parent: logger.channel_base
    arguments: ['lws']

  cache.lws:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [lws]

  lws.host_resolver:
    class: Drupal\lws\Outbound\DnsHostResolver
  Drupal\lws\Outbound\HostResolverInterface: '@lws.host_resolver'

  lws.outbound_http:
    class: Drupal\lws\Outbound\OutboundHttp
    arguments: ['@http_client', '@lws.host_resolver', '@settings']
  Drupal\lws\Outbound\OutboundHttp: '@lws.outbound_http'

  lws.url_parser:
    class: Drupal\lws\Routing\LwsUrlParser
    arguments: ['@config.factory']
  Drupal\lws\Routing\LwsUrlParser: '@lws.url_parser'

  lws.url_generator:
    class: Drupal\lws\Routing\LwsUrlGenerator
    arguments: ['@lws.url_parser', '@config.factory', '@request_stack']
  Drupal\lws\Routing\LwsUrlGenerator: '@lws.url_generator'

  lws.path_processor:
    class: Drupal\lws\Routing\LwsPathProcessor
    arguments: ['@lws.url_parser']
    tags:
      # Above path_processor_decode (1000), so that the path still matches the
      # request's raw, percent-encoded path.
      - { name: path_processor_inbound, priority: 1100 }

  lws.route_enhancer:
    class: Drupal\lws\Routing\LwsRouteEnhancer
    arguments: ['@lws.url_parser']
    tags:
      # Ahead of route_enhancer.param_conversion (5000), which converts the
      # lws_storage slug this adds.
      - { name: route_enhancer, priority: 6000 }

  lws.request_subscriber:
    class: Drupal\lws\EventSubscriber\LwsRequestSubscriber
    arguments: ['@lws.url_parser']
    tags:
      - { name: event_subscriber }

  lws.cors_subscriber:
    class: Drupal\lws\EventSubscriber\LwsCorsSubscriber
    arguments: ['@lws.url_parser']
    tags:
      - { name: event_subscriber }

  lws.config_subscriber:
    class: Drupal\lws\EventSubscriber\LwsConfigSubscriber
    arguments: ['@cache_tags.invalidator']
    tags:
      - { name: event_subscriber }

  lws.exception_subscriber:
    class: Drupal\lws\EventSubscriber\LwsExceptionSubscriber
    arguments: ['@lws.url_parser', '@lws.url_generator', '@logger.channel.lws']
    tags:
      - { name: event_subscriber }

  lws.page_cache_request_policy.disallow_lws_requests:
    class: Drupal\lws\PageCache\DisallowLwsRequests
    arguments: ['@lws.url_parser']
    public: false
    tags:
      - { name: page_cache_request_policy }
